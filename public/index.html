<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f4f8">
  <title>本地助手</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      const saved = localStorage.getItem('local-ai-theme') || 'system';
      const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="会话导航">
      <div class="brand">
        <div class="brand-left">
          <div class="brand-mark" aria-hidden="true"><svg class="icon"><use href="/icons.svg#spark"></use></svg></div>
          <strong>本地助手</strong>
        </div>
        <button class="icon-button small" id="sidebar-collapse" type="button" aria-label="收起会话导航" aria-controls="sidebar">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#sidebar"></use></svg>
        </button>
      </div>
      <button class="nav-item" id="new-chat" type="button">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"></use></svg>
        新建会话
      </button>
      <button class="nav-item" id="search-toggle" type="button" aria-expanded="false" aria-controls="chat-search-wrap">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
        搜索
      </button>
      <div class="chat-search-wrap" id="chat-search-wrap" hidden>
        <input id="chat-search" type="search" placeholder="搜索会话" aria-label="搜索会话">
      </div>
      <nav class="history" id="chat-list" aria-label="历史会话"></nav>
      <div class="sidebar-bottom">
        <div class="model-status-row">
          <button class="model-status" id="status-button" type="button" title="重新检查本地模型">
            <span class="status-dot" id="status-dot" aria-hidden="true"></span>
            <span id="status-text">正在检查模型</span>
          </button>          <div class="settings-menu-wrap">
            <button class="icon-button small" id="settings-button" type="button" aria-label="设置" title="设置" aria-expanded="false" aria-controls="settings-menu">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#settings"></use></svg>
            </button>
            <div class="settings-menu" id="settings-menu" hidden>
              <button class="settings-menu-item" id="settings-store-item" type="button">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#settings"></use></svg>
                模型商店
              </button>
              <div class="settings-menu-label">主题</div>
              <button class="settings-menu-item theme-item" data-theme-value="light" type="button">浅色</button>
              <button class="settings-menu-item theme-item" data-theme-value="dark" type="button">深色</button>
              <button class="settings-menu-item theme-item" data-theme-value="system" type="button">跟随系统</button>
            </div>
          </div>
        </div>
        <div class="model-name" id="model-name" hidden>Qwen3-VL · 仅在本机运行</div>
      </div>
    </aside>
    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="关闭会话导航" tabindex="-1"></button>

    <main class="main">
      <header class="topbar">
        <div class="toolbar-left">
          <button class="icon-button" id="sidebar-toggle" type="button" aria-label="打开或关闭会话导航" aria-controls="sidebar">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#sidebar"></use></svg>
          </button>
        </div>
        <h1 class="conversation-title" id="conversation-title">新会话</h1>
        <div class="topbar-right"></div>
      </header>

      <section class="messages" id="messages" aria-label="对话内容" aria-live="polite" aria-relevant="additions text"></section>
      <button class="back-bottom" id="back-bottom" type="button" hidden>↓ 回到底部</button>

      <footer class="composer-area">
        <div class="composer-wrap">
          <div class="selected-image" id="selected-image" hidden>
            <img id="selected-image-preview" alt="待发送图片预览">
            <div class="selected-image-meta"><strong id="selected-image-name"></strong><span>仅在发送时交给本机模型</span></div>
            <button class="icon-button small" id="remove-image" type="button" aria-label="移除待发送图片">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
            </button>
          </div>
          <div class="selected-image" id="selected-document" hidden>
            <svg class="icon document-icon" aria-hidden="true"><use href="/icons.svg#doc"></use></svg>
            <div class="selected-image-meta"><strong id="selected-document-name"></strong><span>上传后自动分批生成摘要，原文仅保存在本机</span></div>
            <button class="icon-button small" id="remove-document" type="button" aria-label="移除待上传文档">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
            </button>
          </div>
          <form class="composer" id="composer">
            <label class="sr-only" for="message-input">输入消息</label>
            <textarea id="message-input" rows="2" maxlength="32000" placeholder="输入消息，或添加图片……" aria-describedby="composer-note form-error"></textarea>
            <div class="composer-tools">
              <div class="attach-menu-wrap">
                <button class="icon-button attach-menu-button" id="attach-menu-button" type="button" aria-label="添加附件" aria-expanded="false" aria-controls="attach-menu">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"></use></svg>
                </button>
                <div class="attach-menu" id="attach-menu" hidden>
                  <button class="attach-menu-item" id="attach-image-item" type="button">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#paperclip"></use></svg>
                    添加图片
                  </button>
                  <button class="attach-menu-item" id="attach-doc-item" type="button">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#doc"></use></svg>
                    添加文档
                  </button>
                </div>
              </div>
              <input id="image-input" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden>
              <input id="document-input" type="file" hidden accept=".txt,.md,.json,.csv,.log,.pdf,.docx,.xlsx,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.java,.go,.rs,.c,.cpp,.h,.cs,.html,.css,.sh,.yml,.yaml,.toml,.xml,.sql">
              <div class="model-picker-wrap">
                <button class="model-picker" id="model-picker" type="button" aria-expanded="false" aria-controls="model-picker-menu">
                  <span class="model-dot" aria-hidden="true"></span>
                  <span id="model-picker-name">Qwen3-VL · 2B</span>
                  <svg class="icon chev" aria-hidden="true"><use href="/icons.svg#arrow-up"></use></svg>
                </button>
                <div class="model-picker-menu" id="model-picker-menu" hidden></div>
              </div>
              <button class="send primary-button" id="send-button" type="submit" aria-label="发送消息" disabled>
                <svg class="icon" aria-hidden="true"><use id="send-icon" href="/icons.svg#arrow-up"></use></svg>
              </button>
            </div>
          </form>
          <div class="form-error" id="form-error" role="alert" hidden></div>
          <div class="composer-note" id="composer-note">支持中文对话、图片理解与 OCR · 所有处理均在本机完成</div>
        </div>
      </footer>
    </main>
  </div>
  <script type="module" src="/app.mjs"></script>
  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-header">
      <h2 id="settings-title">模型商店</h2>
      <button class="icon-button small" id="settings-close" type="button" aria-label="关闭模型设置">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
      </button>
    </div>
    <div class="settings-body">
      <section class="device-card" id="settings-device" aria-label="当前设备"></section>
      <div class="settings-toolbar">
        <label class="settings-search">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          <input id="model-search" type="search" placeholder="搜索模型（如 qwen、deepseek、vision）" aria-label="搜索模型">
        </label>
        <button class="secondary-button" id="fetch-remote-button" type="button">更新模型目录</button>
      </div>
      <div class="settings-chips" id="vendor-filters"></div>
      <div class="settings-chips" id="model-filters">
        <span class="chip-label">类型</span>
        <button class="chip on" data-filter="all" type="button">全部</button>
        <button class="chip" data-filter="vision" type="button">多模态</button>
        <button class="chip" data-filter="text" type="button">纯文本</button>
        <button class="chip" data-filter="downloaded" type="button">已下载</button>
      </div>
      <div class="settings-error" id="settings-error" role="alert" hidden></div>
      <div class="model-cards" id="settings-models"></div>
      <p class="settings-note">仅下载模型时联网，模型来自 Ollama 官方仓库 · 切换立即生效，无需重启</p>
    </div>
  </dialog>
</body>
</html>
